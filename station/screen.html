<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intake.ai station</title>
<style>
  :root { --bg: #120d1f; --fg: #f4f2ec; --muted: #b3aec2; --panel: #1b1430; --bar: #2e2349; --line: #2e2349;
    --accent: #9b5cff; --ink: #161026;
    --mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font-family: Inter, "Segoe UI Variable", "Segoe UI", system-ui, Roboto, sans-serif; }
  body { display: flex; flex-direction: column; padding: 1.2vh 1.5vw; gap: 1.2vh; }
  #status { border-radius: 8px; padding: 2vh 2vw; background: #3a3644; color: var(--fg); transition: background .2s;
    display: flex; align-items: center; gap: 2vw; }
  #words { flex: 1; min-width: 0; }
  #scan { display: none; font: inherit; font-size: clamp(24px, 4.5vw, 72px); font-weight: 800; color: var(--ink);
    background: var(--fg); border: 0; border-radius: 8px; padding: 1.5vh 3vw; cursor: pointer;
    box-shadow: 0 0 0 4px rgba(244, 242, 236, .25); }
  #scan:active { transform: scale(.97); }
  #text { font-size: clamp(24px, 4.6vw, 80px); font-weight: 800; line-height: 1.05; letter-spacing: -.01em; }
  #sub { font-size: clamp(16px, 2.6vw, 40px); margin-top: .6vh; opacity: .95; min-height: 1.2em; }
  #views { display: flex; gap: 1.5vw; flex: 1; min-height: 0; }
  .view { flex: 1; display: flex; flex-direction: column; min-width: 0; background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px; padding: 1vh 1vw; }
  .view h2 { margin: 0 0 .6vh; font: 500 clamp(11px, 1.3vw, 18px) var(--mono); color: var(--muted);
    text-transform: uppercase; letter-spacing: .08em; }
  .view img { width: 100%; flex: 1; min-height: 0; object-fit: contain; border-radius: 4px; }
  #items { display: grid; gap: 1vh; }
  .item { display: grid; grid-template-columns: minmax(8em, 22%) 1fr 4.5em; align-items: center; gap: 1vw;
    font-size: clamp(16px, 2.6vw, 40px); font-weight: 700; }
  .track { height: 1.1em; background: var(--bar); border-radius: 6px; overflow: hidden; }
  .fill { height: 100%; background: var(--accent); transition: width .4s; }
  .pct { text-align: right; font-variant-numeric: tabular-nums; }
  #foot { font: clamp(11px, 1.1vw, 15px) var(--mono); color: var(--muted); display: flex; justify-content: space-between; }
  #foot b { color: var(--fg); font-weight: 600; }
  @media (max-width: 700px) { #views { flex-direction: column; } }
</style>
</head>
<body>
  <div id="status">
    <div id="words"><div id="text">Starting…</div><div id="sub"></div></div>
    <button id="scan" type="button">SCAN</button>
  </div>
  <div id="views">
    <div class="view"><h2>Camera</h2><img id="live" src="/video" alt="live camera"></div>
    <div class="view"><h2>Before</h2><img id="before" src="/before.jpg" alt="before scan"></div>
    <div class="view"><h2>After</h2><img id="after" src="/after.jpg" alt="after scan"></div>
  </div>
  <div id="items"></div>
  <div id="foot"><span><b>Intake.ai</b> station · runs on Roboflow Inference</span><span id="meta"></span></div>
<script>
let lastSeq = -1;
// server color -> theme [background, text]; idle grey, ready/busy purple, ok green, review amber, error red
const THEME = {'#475569': ['#3a3644', '#f4f2ec'], '#2563eb': ['#6329b7', '#ffffff'], '#1f9d55': ['#15803d', '#ffffff'],
  '#d97706': ['#f5a524', '#161026'], '#dc2626': ['#d92d20', '#ffffff']};
function paint(color) {
  const [bg, fg] = THEME[(color || '').toLowerCase()] || [color, '#f4f2ec'];
  const el = document.getElementById('status');
  el.style.background = bg;
  el.style.color = fg;
}
async function scan() { await fetch('/scan', {method: 'POST'}); }
document.getElementById('scan').addEventListener('click', scan);
document.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'Enter') && document.getElementById('scan').style.display !== 'none') {
    e.preventDefault(); scan();
  }
});
async function poll() {
  try {
    const s = await (await fetch('/state', {cache: 'no-store'})).json();
    paint(s.color);
    document.getElementById('text').textContent = s.text;
    document.getElementById('sub').textContent = s.sub || '';
    document.getElementById('scan').style.display = s.kind === 'ready' ? 'block' : 'none';
    document.getElementById('meta').textContent =
      (s.outbox_pending ? s.outbox_pending + ' waiting to send · ' : 'all sent · ') + s.time;
    if (s.seq !== lastSeq) {
      lastSeq = s.seq;
      const box = document.getElementById('items');
      box.innerHTML = '';
      for (const it of s.items || []) {
        const row = document.createElement('div');
        row.className = 'item';
        const pct = it.pct == null ? null : Math.round(it.pct);
        row.innerHTML = '<span></span><div class="track"><div class="fill"></div></div><span class="pct"></span>';
        row.children[0].textContent = it.name;
        row.querySelector('.fill').style.width = (pct == null ? 100 : pct) + '%';
        if (pct == null) row.querySelector('.fill').style.background = '#3e216b';
        row.children[2].textContent = pct == null ? '' : pct + '%';
        box.appendChild(row);
      }
      if (['ready', 'before', 'after', 'error', 'idle'].includes(s.kind)) {
        document.getElementById('before').src = '/before.jpg?t=' + Date.now();
        document.getElementById('after').src = '/after.jpg?t=' + Date.now();
      }
    }
  } catch (e) {
    document.getElementById('text').textContent = 'Station offline';
    paint('#7f1d1d');
  }
}
poll();
setInterval(poll, 500);
</script>
</body>
</html>
