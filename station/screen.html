<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intake.ai station</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Inter+Tight:wght@500;600&display=swap" rel="stylesheet">
<style>
  /* summit.roboflow.com look: ink + lavender + cream, square corners, mono labels, viewfinder brackets */
  :root { --ink: #121110; --ink2: #1c1a19; --line: #2a2725; --cream: #f4f2ec; --muted: #8b887f;
    --lav: #c29af6; --lav2: #d9c1f3;
    --sans: "Suisse", "Inter Tight", "Helvetica Neue", Arial, sans-serif;
    --mono: "Geist Mono", ui-monospace, "Cascadia Mono", Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; color: var(--cream); font-family: var(--sans);
    background: var(--ink) radial-gradient(var(--line) 1px, transparent 1.2px) 0 0 / 18px 18px; }
  body { display: flex; flex-direction: column; padding: 1.4vh 1.6vw; gap: 1.4vh; }
  #status { padding: 2vh 2vw; background: var(--ink2); color: var(--cream); transition: background .2s;
    display: flex; align-items: center; gap: 2vw; border: 1px solid var(--line); }
  #words { flex: 1; min-width: 0; }
  #text { font-size: clamp(24px, 4.6vw, 80px); font-weight: 500; line-height: 1; letter-spacing: -.03em; }
  #sub { font: 400 clamp(13px, 1.9vw, 30px) var(--mono); text-transform: uppercase; letter-spacing: .06em;
    margin-top: 1vh; opacity: .85; min-height: 1.2em; }
  #scan { display: none; font: 500 clamp(22px, 3.8vw, 64px) var(--mono); letter-spacing: .1em; color: var(--lav);
    background: var(--ink); border: 0; padding: 1.6vh 3vw; cursor: pointer; }
  #scan:hover { background: #000; }
  #scan:active { transform: scale(.97); }
  #views { display: flex; gap: 1.6vw; flex: 1; min-height: 0; }
  .view { flex: 1; display: flex; flex-direction: column; min-width: 0; padding: 1.2vh 1vw;
    background:
      linear-gradient(var(--lav), var(--lav)) left top / 22px 2px no-repeat,
      linear-gradient(var(--lav), var(--lav)) left top / 2px 22px no-repeat,
      linear-gradient(var(--lav), var(--lav)) right top / 22px 2px no-repeat,
      linear-gradient(var(--lav), var(--lav)) right top / 2px 22px no-repeat,
      linear-gradient(var(--lav), var(--lav)) left bottom / 22px 2px no-repeat,
      linear-gradient(var(--lav), var(--lav)) left bottom / 2px 22px no-repeat,
      linear-gradient(var(--lav), var(--lav)) right bottom / 22px 2px no-repeat,
      linear-gradient(var(--lav), var(--lav)) right bottom / 2px 22px no-repeat,
      var(--ink2); }
  .view h2 { margin: 0 0 .8vh; font: 400 clamp(11px, 1.2vw, 17px) var(--mono); color: var(--muted);
    text-transform: uppercase; letter-spacing: .1em; }
  .view h2::before { content: "■  "; color: var(--lav); }
  .view img { width: 100%; flex: 1; min-height: 0; object-fit: contain; }
  #items { display: grid; gap: 1vh; }
  .item { display: grid; grid-template-columns: minmax(8em, 22%) 1fr 4.5em; align-items: center; gap: 1vw;
    font-size: clamp(16px, 2.4vw, 38px); font-weight: 500; letter-spacing: -.02em; }
  .track { height: .9em; background: var(--line); overflow: hidden; }
  .fill { height: 100%; background: var(--lav); transition: width .4s; }
  .pct { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--lav); }
  #foot { font: clamp(10px, 1vw, 14px) var(--mono); color: var(--muted); display: flex; justify-content: space-between;
    text-transform: uppercase; letter-spacing: .08em; }
  #foot b { color: var(--lav); font-weight: 500; }
  @media (max-width: 700px) { #views { flex-direction: column; } }
</style>
</head>
<body>
  <div id="status">
    <div id="words"><div id="text">Starting…</div><div id="sub"></div></div>
    <button id="scan" type="button">SCAN</button>
  </div>
  <div id="views">
    <div class="view"><h2>Camera</h2><img id="live" src="/video" alt="live camera"></div>
    <div class="view"><h2>Before</h2><img id="before" src="/before.jpg" alt="before scan"></div>
    <div class="view"><h2>After</h2><img id="after" src="/after.jpg" alt="after scan"></div>
  </div>
  <div id="items"></div>
  <div id="foot"><span><b>Intake.ai</b> · kitchen station · runs on Roboflow Inference</span><span id="meta"></span></div>
<script>
let lastSeq = -1;
// server color -> theme [background, text]: idle ink, ready/busy lavender, ok mint, review amber, error red
const THEME = {'#475569': ['#1c1a19', '#f4f2ec'], '#2563eb': ['#c29af6', '#121110'], '#1f9d55': ['#b9f0c8', '#121110'],
  '#d97706': ['#ffd27a', '#121110'], '#dc2626': ['#ef4444', '#121110']};
function paint(color) {
  const [bg, fg] = THEME[(color || '').toLowerCase()] || [color, '#f4f2ec'];
  const el = document.getElementById('status');
  el.style.background = bg;
  el.style.color = fg;
}
async function scan() { await fetch('/scan', {method: 'POST'}); }
document.getElementById('scan').addEventListener('click', scan);
document.addEventListener('keydown', e => {
  if ((e.code === 'Space' || e.code === 'Enter') && document.getElementById('scan').style.display !== 'none') {
    e.preventDefault(); scan();
  }
});
async function poll() {
  try {
    const s = await (await fetch('/state', {cache: 'no-store'})).json();
    paint(s.color);
    document.getElementById('text').textContent = s.text;
    document.getElementById('sub').textContent = s.sub || '';
    document.getElementById('scan').style.display = s.kind === 'ready' ? 'block' : 'none';
    document.getElementById('meta').textContent =
      (s.outbox_pending ? s.outbox_pending + ' waiting to send · ' : 'all sent · ') + s.time;
    if (s.seq !== lastSeq) {
      lastSeq = s.seq;
      const box = document.getElementById('items');
      box.innerHTML = '';
      for (const it of s.items || []) {
        const row = document.createElement('div');
        row.className = 'item';
        const pct = it.pct == null ? null : Math.round(it.pct);
        row.innerHTML = '<span></span><div class="track"><div class="fill"></div></div><span class="pct"></span>';
        row.children[0].textContent = it.name;
        row.querySelector('.fill').style.width = (pct == null ? 100 : pct) + '%';
        if (pct == null) row.querySelector('.fill').style.background = '#4a3a63';
        row.children[2].textContent = pct == null ? '' : pct + '%';
        box.appendChild(row);
      }
      if (['ready', 'before', 'after', 'error', 'idle'].includes(s.kind)) {
        document.getElementById('before').src = '/before.jpg?t=' + Date.now();
        document.getElementById('after').src = '/after.jpg?t=' + Date.now();
      }
    }
  } catch (e) {
    document.getElementById('text').textContent = 'Station offline';
    paint('#7f1d1d');
  }
}
poll();
setInterval(poll, 500);
</script>
</body>
</html>
